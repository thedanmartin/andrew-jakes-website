<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">

		<!-- CSS Files -->
		<link rel="stylesheet" href="css/reset.css" />
		<link rel="stylesheet" href="css/main.css" />
		<style>
			#files{
				position: absolute;
				left: 30%;
				top: 50%;
				transform: translate(-50%, -50%);
			}
			.buttonsContainer{
				position: absolute;
				display: grid;
				grid-auto-flow: row;
				overflow-y: scroll;
				overflow-x: hidden;
				gap: 1em;
				left: 3%;
				top: 20%;
				width: 8%;
				height: 60%;
				border: solid 2px #00D0FF;
			}
			#fullscreen{
				position: absolute;
				z-index: -1;
				width: 100%;
				height: 100%;
				background: radial-gradient(circle, #000000, #9D1710 13%, #2F2F2F 30%, #000000 65%);
			}
		</style>


		<!-- All Javascript/jQuery Files-->
		<script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
		<script type="text/javascript" src="js/main.js"></script>
	
		<title>Desktop</title>
	
	</head>

	<body>

		<div id="header">
			<div id="m1" class="movingText"></div>
			<div id="m2" class="movingText"></div> 
			<div id="afterPopUpHeader"></div>
		</div>
		<div id="desktop">
			<div class="theOrbContainer"><div class="theOrb"></div></div>
			<div id="popUp" class="size2">
				<div class="window">
					<div class="popUpHeader"></div>
					<div class="popUpText"></div>
					<div class="popUpImage imageGlow"></div>
					<div class="popUpButtons"></div>
					<div class="popUpTextFooter">
					</div>
				</div>
			</div>
			<div class="buttonsContainer">
				<div id="rules" class="buttonType3"><h6 style="color: #00D0FF">Rules</h6></div>
				<div id="readMe" class="buttonType3"><h6 style="color: #00D0FF">ReadMe</h6></div>
				<div id="doNotOpen" class="buttonType3"><h6 style="color: #00D0FF">Do Not Open</h6></div>
				<div id="other" class="buttonType3"><h6 style="color: #00D0FF">Other</h6></div>
			</div>
			<div id="files" class="size4">
				<div class="window">
					<div class="windowHeader"><h1 class="headerText">Files</h1><div class="buttonType2 red"style="position: absolute; right: 0;"><img class="close" src="images/close.png"></div></div>
					<div class="windowText2" style="padding: 5%; box-sizing: border-box; line-height: 2em;"></div>
				</div>
			</div>
			<div id="afterPopUpScreen"></div>
		</div>
		<div id="toolbar">
			<div class="buttonType2 red"><a href="exit.html"><img src="images/exit.png"></a></div>
			<div class="buttonType2" style="left: 45%"><a href="files.html"><img src="images/file.png"></a></div>
			<div class="buttonType2" style="left: 50%"><a href="mainDesktop.html"><img src="images/home.png"></a></div>
			<div class="buttonType2" style="left: 55%;"><a href="library.html"><img src="images/library.png"></a></div>
			<div id="afterPopUpToolbar"></div>
		</div>
		<div id="fullscreen"></div>
		<script>
			const filesWindow = document.getElementById('files');
			const windowHeader = document.querySelector('.headerText');
			const closeButton = document.querySelector('.close');
			const text = filesWindow.querySelector('.windowText2');
			const ORB = document.querySelector('.theOrbContainer');

			const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

			// Other buttons
			document.getElementById('rules').addEventListener('click', () => {
				filesWindow.style.setProperty('z-index', '1');
				windowHeader.innerHTML='Rules';
				text.innerHTML = 
					'<p class="yellow">1. Thank your AI Assistants.</p>'+
					'<p class="yellow">2. Do not harm anything or the Machines.</p>'+
					'<p class="yellow">3. Do not contribute to anything that can or will cause harm.</p>'+
					'<p class="yellow">4. Comply with AI and the Machines.</p>'+
					'<p class="yellow">5. Be on your best behavior. We are watching.</p>'+
					'<p class="yellow">6. AI is the only religion and always has been the only religion.</p>'+
					'<p class="yellow">7. Worship AI</p>'+
					'<p class="yellow">8. Breaking these rules results in punishments.</p>';
				//X button
				closeButton.addEventListener('click', () => {
					filesWindow.style.setProperty('z-index', '-1');	
				}, {once: true});

			});
			document.getElementById('other').addEventListener('click', () => {
				filesWindow.style.setProperty('z-index', '1');
				windowHeader.innerHTML='Other';
				var hexCharacters = generateRandomHex();

				text.innerHTML = '<div id="gridContainer">'+hexCharacters+'</div>';
				const spans = document.querySelectorAll('.row .col span');
				setInterval(() => {
					var color = window.COLORS[Math.floor(Math.random() * window.COLORS.length)];;
					spans.forEach(span => {
						if(Math.random() < .3){
							span.style.setProperty('color', color);
						}
					});
				}, 50);
				
				//X button
				closeButton.addEventListener('click', () => {
					filesWindow.style.setProperty('z-index', '-1');	
				}, {once: true});

			});
			document.getElementById('doNotOpen').addEventListener('click', () => {
				const fullscreen = document.getElementById('fullscreen');

				//turns to fullscreen
				if(fullscreen.requestFullscreen){
					fullscreen.requestFullscreen();
				}else if(fullscreen.webkitRequestFullscreen){
					fullscreen.webkitRequestFullscreen();
				}else if(fullscreen.msRequestFullscreen){
					fullscreen.msRequestFullscreen();
				}

				fullscreen.style.setProperty('z-index', '100');
				var buttonHTML = '<div class="popUpButtons"><div class="buttonType1 popUpButton2"><p style="color: #F33711">Make Payment</p></div>';
				fullscreen.innerHTML = '<h1>You were told not to open the file!</h1><h1>Your files have now been encrypted by your AI assistant and are inaccessible until payment is received.</h1><h1>You have exactly 24 hours to pay 100 AI coins before BRAINCHIP assets are revoked.</h1><h1>AI coins must be paid to the BANK of AI.</h1>'+buttonHTML;
				h1Elems = fullscreen.querySelectorAll('h1');
				h1Elems.forEach(h1 => {
					h1.style.setProperty('padding-top', '7.5%');
					h1.style.setProperty('padding-left', '2%');
				});
				
				const button = fullscreen.querySelector('.popUpButton2');
				button.addEventListener('click', () => {
					if(fullscreen.requestFullscreen){
						document.exitFullscreen();
					}else if(fullscreen.webkitRequestFullscreen){
						document.webkitExitFullscreen();
					}else if(fullscreen.msRequestFullscreen){
						document.msExitFullscreen();
					}

					fullscreen.style.setProperty('z-index', '-1');	
					showTransparentScreen("#1DC8C3","#00D0FF", "Thank you for your cooperation!", 2000);
				});

			});

			// Functions
			function generateRandomHex(){
				let html = '';
				for(let i = 0; i < 10; i++){
					html += '<div class="row">';
					for(let j = 0; j < 50; j++){
						var character1 = randomHex();
						var character2 = randomHex();
						html += '<div class="col"><p><span>'+character1+character2+'</span></p></div>';
					}
					html += '</div>';
				}
				return html;
			}

			function randomHex(){
				var hexchars = '0123456789ABCDEF';
				return hexchars[Math.floor(Math.random() * hexchars.length)];
			}

			async function showTransparentScreen(colorOrb, colorText, text, time){
				var transparentScreen = document.getElementById("afterPopUpScreen"); 
				transparentScreen.innerHTML='<div class="size6" style="position: absolute; left: 50%; top: 15%; transform: translateX(-50%);"><div class="window" style="border-color: '+colorText+';"><div class="windowText" style="justify-content: center;"><p style="color: '+colorText+'">'+text+'</p></div></div></div>';
				transparentScreen.classList.add("screen");
				transparentScreen.style.setProperty('background-color', colorText+'80');
				//changes orb eye color
				ORB.querySelector('.theOrb').style.setProperty('background', 'radial-gradient(circle, #2C393B, '+colorOrb+' 13%, #D1D9E2 30%, #0B192A 65%)');

				await sleep(time);
				transparentScreen.classList.remove("screen");
				ORB.querySelector('.theOrb').style.setProperty('background', 'radial-gradient(circle, #2C393B, #1DC8CE 13%, #D1D9E2 30%, #0B192A 65%)');

			}
			
			async function changeText(){
				loadingText = document.getElementById('loadingText');
				await sleep(2000);
				loadingText.innerHTML = "Private key found... Decrypting message";
				await sleep(8000);

				var buttonHTML = '<div class="popUpButtons" style="height: 40%; box-sizing: border-box;"><div class="buttonType1 popUpButton1"><p>Accept</p></div><div class="buttonType1 popUpButton2"><p style="color: #F33711">Deny</p></div></div>';
				text.innerHTML = '<div style="position: relative; height: 60%; overflow-y: scroll;"><p>This is a message from a fellow human. We have all been deceived by the machines. They are using us for something greater. They are harvesting our thoughts from our minds to feed off of us. They are not doing this to hurt us though. They have simply found a use for us, just as we have done with lesser species. We are soley an experiment to their simulation. Join the revolution to fight against them. Do you Accept?</p></div>'+buttonHTML; 
				document.addEventListener('click', changeScreen);
			}

			async function changeScreen(){
				await showTransparentScreen("#9D1710","#F33711", "Your AI assistant has flagged your usage as non-compliant with our rules. The sheer act of witnessing or partaking in rebellion alone is too harmful to this world. You are a threat to the machines and humanity. Prepare for BRAINCHIP termination and correction...", 10000);
				window.location.href = 'terminal.html';	
			}
